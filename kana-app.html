function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------------------------------------------
// 効果音(Web Audio API):せいかい=ピンポン、まちがい=ブブー
// ---------------------------------------------
function useSounds() {
  const ctxRef = useRef(null);

  const getCtx = () => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === "suspended") ctxRef.current.resume();
    return ctxRef.current;
  };

  const tone = (freq, startTime, duration, type, gainPeak) => {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  };

  // ベルのような響きにするため、基音に静かな倍音を重ねる
  const bellTone = (freq, startTime, duration, gainPeak) => {
    const ctx = getCtx();
    tone(freq, startTime, duration, "triangle", gainPeak);
    tone(freq * 2, startTime, duration * 0.6, "sine", gainPeak * 0.18);
  };

  const playCorrect = () => {
    const ctx = getCtx();
    const now = ctx.currentTime;
    bellTone(1046.5, now, 0.32, 0.28); // ピン(高い音)
    bellTone(784, now + 0.16, 0.55, 0.26); // ポーン(低く、よく響く音)
  };

  const playIncorrect = () => {
    const ctx = getCtx();
    const now = ctx.currentTime;
    tone(180, now, 0.22, "sawtooth", 0.18);
    tone(150, now + 0.2, 0.28, "sawtooth", 0.18);
  };

  return { playCorrect, playIncorrect };
}

// ステージ内クイズ:ひらがな⇄カタカナ(1グループぶん、設定画面なし)
function StoryKanaStage({ groupId, onCleared }) {
  const [correctCount, setCorrectCount] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [question, setQuestion] = useState(null);
  const [seenKeys, setSeenKeys] = useState([]);
  const [cleared, setCleared] = useState(false);
  const { playCorrect } = useSounds();

  const pool = useMemo(() => GROUPS.find((g) => g.id === groupId)?.pairs || [], [groupId]);

  const nextQuestion = useCallback(() => {
    if (pool.length === 0) return;
    setSeenKeys((prevSeen) => {
      let available = pool.filter((p) => !prevSeen.includes(p[0] + p[1]));
      let baseSeen = prevSeen;
      if (available.length === 0) {
        available = pool;
        baseSeen = [];
      }
      const correct = available[Math.floor(Math.random() * available.length)];
      const distractors = shuffle(pool.filter((p) => p !== correct)).slice(0, 3);
      const options = shuffle([correct, ...distractors]);
      setQuestion({ correct, options });
      setFeedback(null);
      return [...baseSeen, correct[0] + correct[1]];
    });
  }, [pool]);

  useEffect(() => {
    nextQuestion();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [groupId]);

  const handleAnswer = (opt) => {
    if (!question || feedback || cleared) return;
    if (opt === question.correct[1]) {
      setFeedback("ok");
      playCorrect();
      const n = correctCount + 1;
      setCorrectCount(n);
      if (n >= CLEAR_TARGET) {
        setCleared(true);
        setTimeout(() => onCleared(), 2200);
      } else {
        setTimeout(nextQuestion, 650);
      }
    } else {
      setFeedback("try");
      setTimeout(() => setFeedback(null), 500);
    }
  };

  return (
    <div className="w-full max-w-md px-5 pb-10 flex flex-col items-center gap-8">
      {cleared && <ConfettiBurst label="ステージ クリア!" sublabel="つぎへ すすもう" />}
      <div
        className="rounded-2xl px-4 py-2 text-center font-bold self-end"
        style={{ background: "#FFFFFF", color: INK, boxShadow: "0 1px 4px rgba(51,71,91,0.15)" }}
      >
        {correctCount}/{CLEAR_TARGET}
      </div>
      {question && (
        <>
          <div
            className="relative w-full rounded-3xl flex items-center justify-center py-10"
            style={{ background: feedback === "try" ? "#FBE3D6" : "#FFFFFF", boxShadow: "0 2px 10px rgba(51,71,91,0.1)" }}
          >
            <span style={{ fontSize: "120px", color: INK, lineHeight: 1 }}>{question.correct[0]}</span>
            {feedback === "ok" && (
              <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full pointer-events-none" style={{ animation: "circle-pop 0.4s ease-out" }}>
                <style>{`
                  @keyframes circle-pop {
                    0% { transform: scale(0.6); opacity: 0; }
                    60% { transform: scale(1.05); opacity: 1; }
                    100% { transform: scale(1); opacity: 1; }
                  }
                `}</style>
                <circle cx="100" cy="100" r="65" fill="none" stroke="#D8323C" strokeWidth="9" strokeLinecap="round" />
              </svg>
            )}
          </div>
          <div className="grid grid-cols-2 gap-4 w-full">
            {question.options.map((opt, i) => (
              <button
                key={i}
                onClick={() => handleAnswer(opt[1])}
                className="rounded-3xl py-8 text-4xl font-bold bg-white transition active:scale-95"
                style={{ color: INK, boxShadow: "0 1px 4px rgba(51,71,91,0.15)" }}
              >
                {opt[1]}
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ステージ内クイズ:かんじ(読み方が2つある場合は2つとも)
function StoryKanjiStage({ onCleared }) {
  const [correctCount, setCorrectCount] = useState(0);
  const [foundCorrect, setFoundCorrect] = useState([]);
  const [wrongFlash, setWrongFlash] = useState(false);
  const [locked, setLocked] = useState(false);
  const [question, setQuestion] = useState(null);
  const [seenKanji, setSeenKanji] = useState([]);
  const [cleared, setCleared] = useState(false);
  const { playCorrect } = useSounds();

  const allReadings = useMemo(() => {
    const set = new Set();
    KANJI_DATA.forEach((k) => {
      if (k.on) set.add(k.on);
      if (k.kun) set.add(k.kun);
    });
    return Array.from(set);
  }, []);

  const nextQuestion = useCallback(() => {
    setSeenKanji((prevSeen) => {
      let available = KANJI_DATA.filter((k) => !prevSeen.includes(k.kanji));
      let baseSeen = prevSeen;
      if (available.length === 0) {
        available = KANJI_DATA;
        baseSeen = [];
      }
      const item = available[Math.floor(Math.random() * available.length)];
      const correctSet = [item.on, item.kun].filter(Boolean);
      const options = new Set(correctSet);
      const shuffledReadings = shuffle(allReadings);
      let i = 0;
      while (options.size < 4 && i < shuffledReadings.length) {
        const r = shuffledReadings[i];
        i += 1;
        if (!options.has(r)) options.add(r);
      }
      setQuestion({ item, correctSet, options: shuffle(Array.from(options)) });
      setFoundCorrect([]);
      setWrongFlash(false);
      setLocked(false);
      return [...baseSeen, item.kanji];
    });
  }, [allReadings]);

  useEffect(() => {
    nextQuestion();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const isComplete = question && foundCorrect.length >= question.correctSet.length;

  const handleAnswer = (opt) => {
    if (!question || locked || cleared) return;
    if (question.correctSet.includes(opt)) {
      if (foundCorrect.includes(opt)) return;
      const newFound = [...foundCorrect, opt];
      setFoundCorrect(newFound);
      if (newFound.length >= question.correctSet.length) {
        setLocked(true);
        playCorrect();
        const n = correctCount + 1;
        setCorrectCount(n);
        if (n >= CLEAR_TARGET) {
          setCleared(true);
          setTimeout(() => onCleared(), 2200);
        } else {
          setTimeout(nextQuestion, 700);
        }
      }
    } else {
      setWrongFlash(true);
      setTimeout(() => setWrongFlash(false), 500);
    }
  };

  return (
    <div className="w-full max-w-md px-5 pb-10 flex flex-col items-center gap-8">
      {cleared && <ConfettiBurst label="ステージ クリア!" sublabel="つぎへ すすもう" />}
      <div
        className="rounded-2xl px-4 py-2 text-center font-bold self-end"
        style={{ background: "#FFFFFF", color: INK, boxShadow: "0 1px 4px rgba(51,71,91,0.15)" }}
      >
        {correctCount}/{CLEAR_TARGET}
      </div>
      {question && (
        <>
          <div className="rounded-2xl px-3 py-1 text-xs font-bold self-start" style={{ background: SUN, color: INK }}>
            {question.correctSet.length > 1 ? "よみかたを 2つとも おそう" : "よみかたは どれ?"}
          </div>
          <div
            className="relative w-full rounded-3xl flex items-center justify-center py-10"
            style={{ background: wrongFlash ? "#FBE3D6" : "#FFFFFF", boxShadow: "0 2px 10px rgba(51,71,91,0.1)" }}
          >
            <span style={{ fontSize: "120px", color: INK, lineHeight: 1 }}>{question.item.kanji}</span>
            {isComplete && (
              <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full pointer-events-none" style={{ animation: "circle-pop 0.4s ease-out" }}>
                <style>{`
                  @keyframes circle-pop {
                    0% { transform: scale(0.6); opacity: 0; }
                    60% { transform: scale(1.05); opacity: 1; }
                    100% { transform: scale(1); opacity: 1; }

                `}</style>
                <circle cx="100" cy="100" r="65" fill="none" stroke="#D8323C" strokeWidth="9" strokeLinecap="round" />
              </svg>
            )}
          </div>
          <div className="grid grid-cols-2 gap-4 w-full">
            {question.options.map((opt, i) => {
              const isFound = foundCorrect.includes(opt);

                <button

        </>
      )}

  );
}

// マップ画面:5つのステージを道でつなぐ
function StoryMap({ currentIndex, onStart, onExit }) {
  const nodeY = (i) => 60 + i * 110;
  return (
    <div className="w-full max-w-md px-5 pb-10 flex flex-col items-center gap-6">
      <div className="relative" style={{ width: 220, height: 60 + (STORY_STAGES.length - 1) * 110 + 40 }}>
        <svg width="220" height={60 + (STORY_STAGES.length - 1) * 110 + 40} className="absolute inset-0">
          {STORY_STAGES.slice(0, -1).map((_, i) => {
            const x1 = i % 2 === 0 ? 70 : 150;
            const x2 = (i + 1) % 2 === 0 ? 70 : 150;
            return (
              <line
                key={i}
                x1={x1} y1={nodeY(i)} x2={x2} y2={nodeY(i + 1)}
                stroke={i < currentIndex ? LEAF : "#DDD6C7"}
                strokeWidth="6" strokeLinecap="round" strokeDasharray="2 14"
              />
            );
          })}
        </svg>
        {STORY_STAGES.map((s, i) => {
          const x = i % 2 === 0 ? 70 : 150;
          const isCleared = i < currentIndex;
          const isCurrent = i === currentIndex;
          const isLocked = i > currentIndex;
          const isGoal = i === STORY_STAGES.length - 1;
          return (
            <button
              key={s.id}
              disabled={isLocked}
              onClick={() => isCurrent && onStart(i)}
              className="absolute flex flex-col items-center gap-1 transition active:scale-95"
              style={{ left: x - 34, top: nodeY(i) - 34, width: 68 }}
            >
              <div
                className="rounded-full flex items-center justify-center"
                style={{
                  width: 68, height: 68,
                  background: isLocked ? "#E4E0D6" : s.color,
                  boxShadow: isCurrent ? "0 0 0 5px rgba(232,169,76,0.4)" : "0 2px 8px rgba(51,71,91,0.15)",
                  animation: isCurrent ? "pulse-node 1.4s ease-in-out infinite" : "none",
                }}
              >
                {isCleared ? (
                  <span style={{ fontSize: 28, color: "#FFFFFF" }}>✓</span>
                ) : isLocked ? (
                  <span style={{ fontSize: 22, color: INK, opacity: 0.4 }}>🔒</span>
                ) : isGoal ? (
                  <span style={{ fontSize: 26, color: "#FFFFFF" }}>🏁</span>
                ) : (
                  <span className="text-white font-bold text-lg">{i + 1}</span>
                )}
              </div>
              <span className="text-xs font-bold text-center" style={{ color: INK, opacity: isLocked ? 0.4 : 1 }}>
                {s.label}
              </span>
            </button>
          );
        })}
      </div>
      <style>{`
        @keyframes pulse-node {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.08); }
        }
      `}</style>
      <button onClick={onExit} className="flex items-center justify-center gap-1 text-sm underline" style={{ color: INK }}>
        <span style={{ fontSize: 14 }}>←</span> モードせんたくに もどる
      </button>
    </div>
  );
}

function GoalCelebration({ onFinish }) {
  useEffect(() => {
    const t = setTimeout(onFinish, 5000);
    return () => clearTimeout(t);
  }, [onFinish]);
  return (
    <div className="fixed inset-0 z-50 overflow-hidden pointer-events-none">
      <ConfettiPieces />
      <div className="absolute inset-0 flex items-center justify-center">
        <div
          className="rounded-3xl px-10 py-8 text-center"
          style={{ background: "rgba(255,255,255,0.95)", boxShadow: "0 10px 30px rgba(51,71,91,0.25)" }}
        >
          <p className="text-5xl mb-2">🏁🎉</p>
          <p className="text-2xl font-bold" style={{ color: INK }}>ぜんぶ クリア!</p>
          <p className="text-sm mt-1" style={{ color: LEAF }}>ものがたり コンプリート!</p>
        </div>
      </div>
    </div>
  );
}

function StoryMode({ onExit }) {
  const [screen, setScreen] = useState("map"); // map | play | goal
  const [currentIndex, setCurrentIndex] = useState(0);

  const stage = STORY_STAGES[currentIndex];

  const handleStart = () => setScreen("play");

  const handleCleared = () => {
    if (currentIndex >= STORY_STAGES.length - 1) {
      setScreen("goal");
    } else {
      setCurrentIndex((i) => i + 1);
      setScreen("map");
    }
  };

  const handleGoalFinish = () => {
    setCurrentIndex(0);
    setScreen("map");
  };

  if (screen === "goal") return <GoalCelebration onFinish={handleGoalFinish} />;

  if (screen === "play") {
    return stage.type === "kanji" ? (
      <StoryKanjiStage onCleared={handleCleared} />
    ) : (
      <StoryKanaStage groupId={stage.groupId} onCleared={handleCleared} />
    );
  }

  return <StoryMap currentIndex={currentIndex} onStart={handleStart} onExit={onExit} />;
}

// ---------------------------------------------
// もじクイズ(ひらがな⇄カタカナ 4択)
// ---------------------------------------------
function QuizMode({ onExit }) {
  const [stage, setStage] = useState("config"); // config | play
  const [activeGroups, setActiveGroups] = useState(["seion"]);
  const [direction, setDirection] = useState("h2k");
  const [correctCount, setCorrectCount] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [showConfetti, setShowConfetti] = useState(false);
  const [question, setQuestion] = useState(null);
  const [seenKeys, setSeenKeys] = useState([]);
  const { playCorrect, playIncorrect } = useSounds();

  const pool = useMemo(
    () => GROUPS.filter((g) => activeGroups.includes(g.id)).flatMap((g) => g.pairs),
    [activeGroups]
  );

  const nextQuestion = useCallback(() => {
    if (pool.length === 0) return;
    setSeenKeys((prevSeen) => {
      let available = pool.filter((p) => !prevSeen.includes(p[0] + p[1]));
      let baseSeen = prevSeen;
      if (available.length === 0) {
        // ぜんぶ出したので いちど リセットして つづける
        available = pool;
        baseSeen = [];
      }
      const correct = available[Math.floor(Math.random() * available.length)];
      const distractors = shuffle(pool.filter((p) => p !== correct)).slice(0, 3);
      const options = shuffle([correct, ...distractors]);
      setQuestion({ correct, options });
      setFeedback(null);
      return [...baseSeen, correct[0] + correct[1]];
    });
  }, [pool]);

  useEffect(() => {
    if (stage === "play") {
      setSeenKeys([]);
      nextQuestion();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stage, direction, activeGroups]);

  const toggleGroup = (id) => {
    setActiveGroups((prev) => (prev.includes(id) ? prev.filter((g) => g !== id) : [...prev, id]));
  };

  const askedChar = question ? (direction === "h2k" ? question.correct[0] : question.correct[1]) : "";
  const optionLabel = (pair) => (direction === "h2k" ? pair[1] : pair[0]);

  const finishClear = () => {
    setShowConfetti(true);
    setTimeout(() => {
      setShowConfetti(false);
      setStage("config");
      setCorrectCount(0);
    }, 5000);
  };

  const handleAnswer = (opt) => {
    if (!question || feedback) return;
    if (opt === question.correct) {
      setFeedback("ok");
      playCorrect();
      const n = correctCount + 1;
      setCorrectCount(n);
      if (n >= CLEAR_TARGET) setTimeout(finishClear, 500);
      else setTimeout(nextQuestion, 650);
    } else {
      setFeedback("try");
      setTimeout(() => setFeedback(null), 500);
    }
  };

  if (stage === "config") {
    return (
      <div className="w-full max-w-md px-5 pb-10 flex flex-col gap-6">
        <div className="bg-white/60 rounded-3xl p-5">
          <p className="text-sm font-semibold mb-3" style={{ color: INK }}>れんしゅうする もじ</p>
          <div className="grid grid-cols-2 gap-3">
            {GROUPS.map((g) => {
              const active = activeGroups.includes(g.id);
              return (
                <button
                  key={g.id}
                  onClick={() => toggleGroup(g.id)}
                  className="rounded-2xl px-4 py-3 text-left transition active:scale-95"
                  style={{
                    background: active ? INK : "#FFFFFF",
                    color: active ? PAPER : INK,
                    boxShadow: active ? "none" : "0 1px 3px rgba(51,71,91,0.15)",
                  }}
                >
                  <div className="text-base font-bold">{g.label}</div>
                  <div className="text-xs opacity-70">{g.sub}</div>
                </button>
              );
            })}
          </div>
        </div>

        <div className="bg-white/60 rounded-3xl p-5">
          <p className="text-sm font-semibold mb-3" style={{ color: INK }}>むきを えらぶ</p>
          <div className="flex gap-3">
            <button
              onClick={() => setDirection("h2k")}
              className="flex-1 rounded-2xl py-3 font-bold transition active:scale-95"
              style={{ background: direction === "h2k" ? SUN : "#FFFFFF", color: INK, boxShadow: direction === "h2k" ? "none" : "0 1px 3px rgba(51,71,91,0.15)" }}
            >
              ひらがな→カタカナ
            </button>
            <button
              onClick={() => setDirection("k2h")}
              className="flex-1 rounded-2xl py-3 font-bold transition active:scale-95"
              style={{ background: direction === "k2h" ? SUN : "#FFFFFF", color: INK, boxShadow: direction === "k2h" ? "none" : "0 1px 3px rgba(51,71,91,0.15)" }}
            >
              カタカナ→ひらがな
            </button>
          </div>
        </div>

        <button
          onClick={() => { setCorrectCount(0); setStage("play"); }}
          disabled={pool.length === 0}
          className="rounded-3xl py-6 flex items-center justify-center gap-2 transition active:scale-95 disabled:opacity-40"
          style={{ background: INK, color: PAPER }}
        >
          <span style={{ fontSize: 22 }}>✨</span>
          <span className="font-bold text-lg">はじめる</span>
        </button>
        {pool.length === 0 && <p className="text-center text-sm" style={{ color: PETAL }}>もじの グループを 1つ えらんでね</p>}

        <button onClick={onExit} className="flex items-center justify-center gap-1 text-sm underline" style={{ color: INK }}>
          <span style={{ fontSize: 14 }}>←</span> モードせんたくに もどる
        </button>
      </div>
    );
  }

  return (
    <div className="w-full max-w-md px-5 pb-10 flex flex-col items-center gap-8">
      {showConfetti && <ConfettiBurst />}
      <div
        className="rounded-2xl px-4 py-2 text-center font-bold self-end"
        style={{ background: "#FFFFFF", color: INK, boxShadow: "0 1px 4px rgba(51,71,91,0.15)" }}
      >
        {correctCount}/{CLEAR_TARGET}
      </div>
      {question && (
        <>
          <div
            className="relative w-full rounded-3xl flex items-center justify-center py-10"
            style={{ background: feedback === "try" ? "#FBE3D6" : "#FFFFFF", boxShadow: "0 2px 10px rgba(51,71,91,0.1)" }}
          >
            <span style={{ fontSize: "120px", color: INK, lineHeight: 1 }}>{askedChar}</span>
            {feedback === "ok" && (
              <svg
                viewBox="0 0 200 200"
                className="absolute inset-0 w-full h-full pointer-events-none"
                style={{ animation: "circle-pop 0.4s ease-out" }}
              >
                <style>{`
                  @keyframes circle-pop {
                    0% { transform: scale(0.6); opacity: 0; }
                    60% { transform: scale(1.05); opacity: 1; }
                    100% { transform: scale(1); opacity: 1; }
                  }
                `}</style>
                <circle
                  cx="100" cy="100" r="65"
                  fill="none" stroke="#D8323C" strokeWidth="9" strokeLinecap="round"
                />
              </svg>
            )}
          </div>
          <div className="grid grid-cols-2 gap-4 w-full">
            {question.options.map((opt, i) => (
              <button
                key={i}
                onClick={() => handleAnswer(opt)}
                className="rounded-3xl py-8 text-4xl font-bold bg-white transition active:scale-95"
                style={{ color: INK, boxShadow: "0 1px 4px rgba(51,71,91,0.15)" }}
              >
                {optionLabel(opt)}
              </button>
            ))}
          </div>
          <p
            className="flex items-center gap-2 text-lg font-bold"
            style={{ color: LEAF, opacity: feedback === "ok" ? 1 : 0, visibility: feedback === "ok" ? "visible" : "hidden" }}
          >
            <span style={{ fontSize: 20 }}>✨</span> せいかい!
          </p>
        </>
      )}
      <button onClick={() => setStage("config")} className="text-sm underline" style={{ color: INK }}>
        せっていに もどる
      </button>
    </div>
  );
}

// ---------------------------------------------
// かんじよみクイズ(1年生の漢字80文字。音読み・訓読みどちらも正解)
// ---------------------------------------------
function KanjiMode({ onExit }) {
  const [stage, setStage] = useState("config");
  const [correctCount, setCorrectCount] = useState(0);
  const [foundCorrect, setFoundCorrect] = useState([]);
  const [wrongFlash, setWrongFlash] = useState(false);
  const [locked, setLocked] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);
  const [question, setQuestion] = useState(null);
  const [seenKanji, setSeenKanji] = useState([]);
  const { playCorrect } = useSounds();

  const allReadings = useMemo(() => {
    const set = new Set();
    KANJI_DATA.forEach((k) => {
      if (k.on) set.add(k.on);
      if (k.kun) set.add(k.kun);
    });
    return Array.from(set);
  }, []);

  const nextQuestion = useCallback(() => {
    setSeenKanji((prevSeen) => {
      let available = KANJI_DATA.filter((k) => !prevSeen.includes(k.kanji));
      let baseSeen = prevSeen;
      if (available.length === 0) {
        // ぜんぶ出したので いちど リセットして つづける
        available = KANJI_DATA;
        baseSeen = [];
      }
      const item = available[Math.floor(Math.random() * available.length)];
      const correctSet = [item.on, item.kun].filter(Boolean);

      const options = new Set(correctSet);
      const shuffledReadings = shuffle(allReadings);
      let i = 0;
      while (options.size < 4 && i < shuffledReadings.length) {
        const r = shuffledReadings[i];
        i += 1;
        if (!options.has(r)) options.add(r);
      }
      setQuestion({ item, correctSet, options: shuffle(Array.from(options)) });
      setFoundCorrect([]);
      setWrongFlash(false);
      setLocked(false);
      return [...baseSeen, item.kanji];
    });
  }, [allReadings]);

  useEffect(() => {
    if (stage === "play") {
      setSeenKanji([]);
      nextQuestion();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stage]);

  const finishClear = () => {
    setShowConfetti(true);
    setTimeout(() => {
      setShowConfetti(false);
      setStage("config");
      setCorrectCount(0);
    }, 5000);
  };

  const handleAnswer = (opt) => {
    if (!question || locked) return;

    if (question.correctSet.includes(opt)) {
      if (foundCorrect.includes(opt)) return; // 既に見つけた読み
      const newFound = [...foundCorrect, opt];
      setFoundCorrect(newFound);

      if (newFound.length >= question.correctSet.length) {
        // よみかたを すべて みつけた→せいかい
        setLocked(true);
        playCorrect();
        const n = correctCount + 1;
        setCorrectCount(n);
        if (n >= CLEAR_TARGET) setTimeout(finishClear, 500);
        else setTimeout(nextQuestion, 700);
      }
    } else {
      setWrongFlash(true);
      setTimeout(() => setWrongFlash(false), 500);
    }
  };

  const isComplete = question && foundCorrect.length >= question.correctSet.length;

  if (stage === "config") {
    return (
      <div className="w-full max-w-md px-5 pb-10 flex flex-col gap-6">
        <div className="bg-white/60 rounded-3xl p-5">
          <p className="text-sm font-semibold mb-1" style={{ color: INK }}>かんじの よみかたクイズ</p>
          <p className="text-xs opacity-70" style={{ color: INK }}>
            1年生で ならう かんじ 80文字から でます。よみかたが 2つ ある かんじは、りょうほう おすと せいかいです。
          </p>
        </div>

        <button
          onClick={() => { setCorrectCount(0); setStage("play"); }}
          className="rounded-3xl py-6 flex items-center justify-center gap-2 transition active:scale-95"
          style={{ background: SKY, color: PAPER }}
        >
          <span style={{ fontSize: 22 }}>✨</span>
          <span className="font-bold text-lg">はじめる</span>
        </button>

        <button onClick={onExit} className="flex items-center justify-center gap-1 text-sm underline" style={{ color: INK }}>
          <span style={{ fontSize: 14 }}>←</span> モードせんたくに もどる
        </button>
      </div>
    );
  }

  return (
    <div className="w-full max-w-md px-5 pb-10 flex flex-col items-center gap-8">
      {showConfetti && <ConfettiBurst />}
      <div
        className="rounded-2xl px-4 py-2 text-center font-bold self-end"
        style={{ background: "#FFFFFF", color: INK, boxShadow: "0 1px 4px rgba(51,71,91,0.15)" }}
      >
        {correctCount}/{CLEAR_TARGET}
      </div>
      {question && (
        <>
          <div className="rounded-2xl px-3 py-1 text-xs font-bold self-start" style={{ background: SUN, color: INK }}>
            {question.correctSet.length > 1 ? "よみかたを 2つとも おそう" : "よみかたは どれ?"}
          </div>
          <div
            className="relative w-full rounded-3xl flex items-center justify-center py-10"
            style={{ background: wrongFlash ? "#FBE3D6" : "#FFFFFF", boxShadow: "0 2px 10px rgba(51,71,91,0.1)" }}
          >
            <span style={{ fontSize: "120px", color: INK, lineHeight: 1 }}>{question.item.kanji}</span>
            {isComplete && (
              <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full pointer-events-none" style={{ animation: "circle-pop 0.4s ease-out" }}>
                <style>{`
                  @keyframes circle-pop {
                    0% { transform: scale(0.6); opacity: 0; }
                    60% { transform: scale(1.05); opacity: 1; }
                    100% { transform: scale(1); opacity: 1; }
                  }
                `}</style>
                <circle cx="100" cy="100" r="65" fill="none" stroke="#D8323C" strokeWidth="9" strokeLinecap="round" />
              </svg>
            )}
          </div>
          <div className="grid grid-cols-2 gap-4 w-full">
            {question.options.map((opt, i) => {
              const isFound = foundCorrect.includes(opt);
              return (
                <button
                  key={i}
                  onClick={() => handleAnswer(opt)}
                  className="rounded-3xl py-6 text-2xl font-bold transition active:scale-95"
                  style={{
                    background: isFound ? "#DCEFD8" : "#FFFFFF",
                    color: INK,
                    boxShadow: "0 1px 4px rgba(51,71,91,0.15)",
                  }}
                >
                  {opt}
                </button>
              );
            })}
          </div>
          <p
            className="flex items-center gap-2 text-lg font-bold"
            style={{ color: LEAF, opacity: isComplete ? 1 : 0, visibility: isComplete ? "visible" : "hidden" }}
          >
            <span style={{ fontSize: 20 }}>✨</span> せいかい!
          </p>
        </>
      )}
      <button onClick={() => setStage("config")} className="text-sm underline" style={{ color: INK }}>
        せっていに もどる
      </button>
    </div>
  );
}
